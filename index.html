    <!-- Firebase session bridge: keeps React parent aware of the Unity iframe's Firebase session.
         When Unity signs in or creates a session, it postMessages UNITY_FIREBASE_USER /
         UNITY_SESSION_CREATED here. We store the info on window.__unitySession so React
         components can read it, and we forward React's UID back to Unity via REACT_TO_UNITY_AUTH
         whenever a frame matching the Unity container appears. -->
    <script>
      (function () {
        window.__unitySession = null;

        // Receive session info broadcast from Unity iframe
        window.addEventListener('message', function (event) {
          if (!event.origin || event.origin !== window.location.origin) return;
          var msg = event.data;
          if (!msg || typeof msg.type !== 'string') return;

          if (msg.type === 'UNITY_FIREBASE_USER') {
            window.__unitySession = window.__unitySession || {};
            window.__unitySession.uid = msg.uid;
            window.__unitySession.isAnonymous = msg.isAnonymous;
            console.log('[Bridge] Unity Firebase user:', msg.uid);
            window.dispatchEvent(new CustomEvent('unity-session-ready', { detail: window.__unitySession }));
            // Reflect React parent UID back to Unity now that the frame is live
            if (window.__reactFirebaseUid) {
              _sendAuthToUnityFrames(window.__reactFirebaseUid);
            }
          }

          if (msg.type === 'UNITY_SESSION_CREATED') {
            window.__unitySession = window.__unitySession || {};
            window.__unitySession.sessionId = msg.sessionId;
            window.__unitySession.uid = msg.uid || window.__unitySession.uid;
            console.log('[Bridge] Unity session created:', msg.sessionId);
            window.dispatchEvent(new CustomEvent('unity-session-ready', { detail: window.__unitySession }));
          }
        });

        // Send React app's Firebase UID to all Unity iframes
        function _sendAuthToUnityFrames(uid) {
          document.querySelectorAll('iframe').forEach(function (frame) {
            try {
              frame.contentWindow.postMessage(
                { type: 'REACT_TO_UNITY_AUTH', data: { uid: uid, authState: 'signed_in' } },
                window.location.origin
              );
            } catch (_e) { /* cross-origin or not yet loaded — skip */ }
          });
        }

        // React app sets window.__reactFirebaseUid after its own auth resolves;
        // the setter triggers a sync to any loaded Unity iframes.
        var _reactUidInternal = null;
        Object.defineProperty(window, '__reactFirebaseUid', {
          get: function () { return _reactUidInternal; },
          set: function (uid) {
            _reactUidInternal = uid;
            if (uid) {
              console.log('[Bridge] React Firebase UID set:', uid);
              _sendAuthToUnityFrames(uid);
            }
          },
          configurable: true
        });

        // Watch for dynamically inserted iframes (Unity loads after React mounts)
        var _lastFrameCount = 0;
        var _observer = new MutationObserver(function () {
          var frames = document.querySelectorAll('iframe');
          if (frames.length !== _lastFrameCount) {
            _lastFrameCount = frames.length;
            if (frames.length > 0 && window.__reactFirebaseUid) {
              _sendAuthToUnityFrames(window.__reactFirebaseUid);
            }
          }
        });
        _observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
